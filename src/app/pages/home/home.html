<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-600 to-pink-500 text-white">
  <div class="text-center space-y-4">



    @if(authService.user$ | async){

    @if (homeSettingsService.homeContent$ | async; as content) {
      <h1 class="text-4xl font-bold">{{ content.title }}</h1>
      <p class="text-lg">{{ content.welcomeText }}</p>
      <button [routerLink]="['/lobby']"
        class="mt-4 px-6 py-2 bg-white text-purple-600 font-semibold rounded-full hover:bg-gray-100 transition">
        {{ content.buttonText }}
      </button>
    } @else {
      <div role="status" aria-live="polite" aria-label="Cargando el contenido de inicio"
        class="flex min-h-28 items-center justify-center">
        <span aria-hidden="true"
          class="h-8 w-8 animate-spin rounded-full border-4 border-white/30 border-t-white"></span>
      </div>
    }
    @if (homeSettingsService.canEditHome$ | async) {
      <div class="fixed bottom-4 right-4 z-40 flex flex-col items-end gap-2">
        <div id="home-admin-controls" [class.hidden]="!isHomeAdminMenuOpen()"
          class="flex flex-col items-end gap-2 rounded-xl bg-black/25 p-2 backdrop-blur-sm">
          <a routerLink="/configuracion"
            class="rounded-full bg-white px-4 py-2 text-sm font-semibold text-purple-700 shadow hover:bg-gray-100">
            Configurar inicio
          </a>
          <button type="button" (click)="isHomeAdminMenuOpen.set(false)"
            class="rounded-full px-3 py-1 text-xs text-white/80 hover:bg-white/10 hover:text-white">
            Ocultar
          </button>
        </div>
        <button type="button" (click)="toggleHomeAdminMenu()"
          [attr.aria-expanded]="isHomeAdminMenuOpen()"
          [attr.aria-label]="isHomeAdminMenuOpen() ? 'Ocultar configuración' : 'Mostrar configuración'"
          aria-controls="home-admin-controls" title="Opciones de configuración"
          class="rounded-full border border-white/40 bg-black/15 p-2 text-white/50 opacity-50 shadow-sm transition hover:bg-black/35 hover:text-white hover:opacity-100 focus-visible:opacity-100 focus-visible:outline-2 focus-visible:outline-white">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M10.5 6h3l.6 1.8a6.8 6.8 0 0 1 1.3.8l1.8-.6 1.5 2.6-1.3 1.3a6.8 6.8 0 0 1 0 1.6l1.3 1.3-1.5 2.6-1.8-.6a6.8 6.8 0 0 1-1.3.8l-.6 1.8h-3l-.6-1.8a6.8 6.8 0 0 1-1.3-.8l-1.8.6-1.5-2.6 1.3-1.3a6.8 6.8 0 0 1 0-1.6l-1.3-1.3 1.5-2.6 1.8.6a6.8 6.8 0 0 1 1.3-.8L10.5 6Z" />
            <circle cx="12" cy="12.7" r="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    }

    }@else {
    <div class="bg-white bg-opacity-10 backdrop-blur-md p-10 rounded-2xl shadow-lg w-full max-w-md relative">
      <app-login></app-login>
    </div>

    }
  </div>
</div>
